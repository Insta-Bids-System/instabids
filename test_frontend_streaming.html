<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIA Streaming Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .chat-area { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 10px; margin: 10px 0; }
        .input-area { display: flex; gap: 10px; }
        .input-area input { flex: 1; padding: 10px; }
        .input-area button { padding: 10px 20px; }
        .message { margin: 10px 0; }
        .user { text-align: right; background: #e3f2fd; padding: 5px; border-radius: 5px; }
        .assistant { background: #f5f5f5; padding: 5px; border-radius: 5px; }
        .streaming { background: #fff3e0; }
        .debug { font-family: monospace; font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>CIA Streaming Test - Direct Frontend</h1>
        
        <div class="chat-area" id="chatArea"></div>
        
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Type your message..." 
                   value="Hi, I need help with kitchen remodel">
            <button onclick="sendMessage()" id="sendBtn">Send</button>
            <button onclick="clearChat()">Clear</button>
        </div>
        
        <div class="debug" id="debugArea">
            <strong>Debug Info:</strong><br>
            Status: <span id="status">Ready</span><br>
            Endpoint: <span id="endpoint">http://localhost:8008/api/cia/stream</span><br>
            Model: <span id="model">-</span><br>
            Time: <span id="timing">-</span><br>
        </div>
    </div>

    <script>
        let conversationId = `test_${Date.now()}`;
        let userId = `user_${Date.now()}`;
        
        function updateStatus(status) {
            document.getElementById('status').textContent = status;
        }
        
        function addMessage(role, content, isStreaming = false) {
            const chatArea = document.getElementById('chatArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role} ${isStreaming ? 'streaming' : ''}`;
            messageDiv.innerHTML = `<strong>${role}:</strong> ${content}`;
            if (isStreaming) {
                messageDiv.id = 'streaming-message';
            }
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
            return messageDiv;
        }
        
        function updateStreamingMessage(content) {
            const streamingMsg = document.getElementById('streaming-message');
            if (streamingMsg) {
                streamingMsg.innerHTML = `<strong>assistant:</strong> ${content}`;
            }
        }
        
        function completeStreamingMessage() {
            const streamingMsg = document.getElementById('streaming-message');
            if (streamingMsg) {
                streamingMsg.classList.remove('streaming');
                streamingMsg.removeAttribute('id');
            }
        }
        
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;
            
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            
            // Add user message
            addMessage('user', message);
            input.value = '';
            
            // Prepare streaming message
            addMessage('assistant', '', true);
            
            updateStatus('Connecting...');
            
            const startTime = Date.now();
            
            try {
                const response = await fetch('http://localhost:8008/api/cia/stream', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'text/event-stream',
                        'Cache-Control': 'no-cache'
                    },
                    body: JSON.stringify({
                        messages: [{ role: 'user', content: message }],
                        conversation_id: conversationId,
                        user_id: userId,
                        max_tokens: 200
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                updateStatus('Streaming...');
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let fullMessage = '';
                let firstToken = true;
                
                while (true) {
                    const { value, done } = await reader.read();
                    
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    
                    const lines = buffer.split('\\n\\n');
                    buffer = lines.pop() || '';
                    
                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        
                        const dataContent = line.slice(6).trim();
                        
                        if (dataContent === '[DONE]') {
                            completeStreamingMessage();
                            updateStatus('Complete');
                            document.getElementById('timing').textContent = `${Date.now() - startTime}ms`;
                            sendBtn.disabled = false;
                            return;
                        }
                        
                        try {
                            const chunk = JSON.parse(dataContent);
                            
                            if (chunk.error) {
                                throw new Error(chunk.error);
                            }
                            
                            const content = chunk.choices?.[0]?.delta?.content || '';
                            
                            if (content) {
                                if (firstToken) {
                                    updateStatus('Receiving...');
                                    document.getElementById('model').textContent = chunk.model || 'unknown';
                                    firstToken = false;
                                }
                                
                                fullMessage += content;
                                updateStreamingMessage(fullMessage);
                            }
                            
                        } catch (parseError) {
                            console.warn('Parse error:', parseError, dataContent);
                        }
                    }
                }
                
            } catch (error) {
                console.error('Streaming error:', error);
                updateStatus(`Error: ${error.message}`);
                completeStreamingMessage();
                updateStreamingMessage(`Error: ${error.message}`);
                sendBtn.disabled = false;
            }
        }
        
        function clearChat() {
            document.getElementById('chatArea').innerHTML = '';
            updateStatus('Ready');
        }
        
        // Enter key support
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
